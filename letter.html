<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter | Joshua</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cursor-glow"></div>
  <div class="floating-bg"></div>

  <nav class="navbar glass">
    <a href="index.html" class="logo">Joshua</a>
    <div class="nav-links">
      <a href="memories.html">Side Quest</a>
      <a href="reasons.html">Reasons</a>
      <a href="letter.html">Letter</a>
      <a href="cake.html">Cake</a>
      <a href="final.html">Perks</a>
    </div>
  </nav>

  <div class="music-widget">
    <div class="music-player glass" id="musicPlayer" hidden>
      <iframe
        title="Joshua's birthday playlist on Apple Music"
        src="https://embed.music.apple.com/qa/playlist/josuday/pl.u-pMyllRjTWzE7b9k"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
      ></iframe>
    </div>
    <button class="music-btn" id="musicBtn" type="button" aria-label="Open music player" aria-controls="musicPlayer" aria-expanded="false">♫</button>
  </div>

  <main class="letter-page">
    <section class="envelope reveal" id="envelope">
      <div class="flap"></div>
      <div class="env-body"><p>Click to open</p></div>
    </section>

    <section class="letter-paper reveal delay-1" id="letterPaper">
      <p class="script-text">Hi baba!!</p>
      <p id="typedLetter"></p>
    </section>
  </main>

  <footer class="footer">Written with all the love words could hold ✦</footer>
  <script src="script.js"></script>
</body>
</html>
